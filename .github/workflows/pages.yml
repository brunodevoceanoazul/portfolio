name: Publish bilingual portfolio

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'package*.json'
      - 'next.config.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Preserve links from the original portfolio
        run: |
          printf '%s\n' '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=pt/curriculo/"><title>Currículo</title><a href="pt/curriculo/">Abrir currículo</a></html>' > out/curriculo.html
          printf '%s\n' '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=pt/projetos/"><title>Projetos</title><a href="pt/projetos/">Abrir projetos</a></html>' > out/projetos.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
